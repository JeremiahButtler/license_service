license_service_subscriptions.settings:
  path: '/admin/config/license-service/subscriptions/settings'
  defaults:
    _form: '\Drupal\license_service_subscriptions\Form\SubscriptionSettingsForm'
    _title: 'Subscription Settings'
  requirements:
    _permission: 'administer license subscriptions'

license_service_subscriptions.subscribers:
  path: '/admin/config/license-service/subscriptions/subscribers'
  defaults:
    _controller: '\Drupal\license_service_subscriptions\Controller\SubscribersController::report'
    _title: 'Subscribers'
  requirements:
    _permission: 'administer license subscriptions'

license_service_subscriptions.choose_plan:
  path: '/subscribe/choose/{token}'
  defaults:
    _form: '\Drupal\license_service_subscriptions\Form\ChoosePlanForm'
    _title: 'Choose Your Plan'
  requirements:
    # Must be authenticated; form validates UID-binding against the token.
    _user_is_logged_in: 'TRUE'
  options:
    # Disable page caching — tokens are single-use and must not be served
    # from a page cache that ignores per-user state.
    no_cache: TRUE

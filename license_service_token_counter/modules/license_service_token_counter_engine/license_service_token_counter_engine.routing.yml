# Author: Jeremiah Buttler
#
# The pricing_table collection, add-form, edit-form, and delete-form routes are
# auto-generated by AdminHtmlRouteProvider from the entity annotation links.
# Only routes that AdminHtmlRouteProvider does NOT generate are listed here.

# Duplicate form — AdminHtmlRouteProvider does not auto-generate routes for
# link template keys other than collection/add-form/edit-form/delete-form.
entity.pricing_table.duplicate_form:
  path: '/admin/config/ai/token-counter/pricing/{pricing_table}/duplicate'
  defaults:
    _entity_form: 'pricing_table.duplicate'
    _title: 'Duplicate pricing table'
  requirements:
    _entity_access: 'pricing_table.update'
  options:
    _admin_route: true
    parameters:
      pricing_table:
        type: entity:pricing_table

# Seed defaults — confirms seeding PricingTable entities for all enabled
# drupal/ai providers that do not already have a table.
license_service_token_counter_engine.pricing_seed:
  path: '/admin/config/ai/token-counter/pricing/seed'
  defaults:
    _form: '\Drupal\license_service_token_counter_engine\Form\PricingSeedForm'
    _title: 'Seed default pricing tables'
  requirements:
    _permission: 'administer ai token counter'
  options:
    _admin_route: true

# Author: Jeremiah Buttler
name: 'License Service Token Counter'
type: module
description: 'Tracks AI token usage for every interaction made through the AI module, across any connected provider. Runs independently; estimated cost is added by the optional licensed Cost Engine submodule.'
package: 'AI'
core_version_requirement: '^10 || ^11'
configure: license_service_token_counter.settings
dependencies:
  - 'ai:ai'
  - 'license_service:license_service'

